<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reel Kitchen">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Reel Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#FFFFFF; --band:#F4F4F1; --sunk:#ECECE8; --card:#FFFFFF;
  --ink:#121314; --ink-2:#5A5F64; --ink-3:#8C9196;
  --rule:#E5E5E1; --rule-2:#CFCFCA;
  --btn:#141516; --btn-ink:#FFFFFF;
  --ok:#2A9A5A; --ok-soft:#DFF3E7; --warn:#A76A12;
  --sh:0 2px 8px rgba(18,19,20,.06),0 12px 32px -14px rgba(18,19,20,.22);
  --sh-lg:0 -4px 24px rgba(18,19,20,.08),0 30px 80px -20px rgba(18,19,20,.45);
  --t1:#4C93B8; --t2:#4F6DA8; --t3:#3E8C79; --t4:#6D8C3F; --t5:#C0912F; --t6:#BE6B35; --t7:#B34A3F;
  --nav:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --band:#191A1D; --sunk:#222327; --card:#1B1C1F;
    --ink:#F1F1EE; --ink-2:#A8ADB1; --ink-3:#767B80;
    --rule:#2A2C30; --rule-2:#3B3E43;
    --btn:#F1F1EE; --btn-ink:#111214;
    --ok:#5DC386; --ok-soft:#1E3A2A; --warn:#D9A84E;
    --sh:0 2px 8px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.7);
    --sh-lg:0 -4px 24px rgba(0,0,0,.5),0 30px 80px -20px rgba(0,0,0,.9);
    --t1:#63AFD3; --t2:#7C9BE0; --t3:#55B49D; --t4:#94B858; --t5:#DDAE4C; --t6:#DC8956; --t7:#DC6B60;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --band:#191A1D; --sunk:#222327; --card:#1B1C1F;
  --ink:#F1F1EE; --ink-2:#A8ADB1; --ink-3:#767B80;
  --rule:#2A2C30; --rule-2:#3B3E43;
  --btn:#F1F1EE; --btn-ink:#111214;
  --ok:#5DC386; --ok-soft:#1E3A2A; --warn:#D9A84E;
  --sh:0 2px 8px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.7);
  --sh-lg:0 -4px 24px rgba(0,0,0,.5),0 30px 80px -20px rgba(0,0,0,.9);
  --t1:#63AFD3; --t2:#7C9BE0; --t3:#55B49D; --t4:#94B858; --t5:#DDAE4C; --t6:#DC8956; --t7:#DC6B60;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.025em;line-height:1.1;text-wrap:balance}
h1{font-size:28px}h2{font-size:22px}h3{font-size:17px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;text-align:left;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.app{max-width:720px;margin:0 auto;padding:0 18px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}.tiny{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink-2)}
.pill i{width:7px;height:7px;border-radius:99px;background:var(--tc);flex:none}
.pill.solid{background:var(--btn);color:var(--btn-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:var(--btn-ink);
  border-radius:99px;padding:12px 20px;font-size:14.5px;font-weight:700;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.o{background:var(--card);color:var(--ink);border:1.5px solid var(--rule-2)}
.btn.o:hover{background:var(--sunk);filter:none}
.btn.s{padding:8px 14px;font-size:13px}
.btn.g{background:var(--ok);color:#fff}
.btn.w{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* top */
.top{position:sticky;top:0;z-index:40;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--rule)}
.top h1{font-size:22px;margin-right:auto;white-space:nowrap}
@media(max-width:420px){.top{gap:8px}.top h1{font-size:19px}.ico{width:30px;height:30px}}
.ramp{display:flex;gap:2px;margin-left:8px}.ramp i{width:10px;height:3px;border-radius:2px}
.wk{display:flex;align-items:center;background:var(--sunk);border-radius:99px;padding:3px}
.wk button{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;color:var(--ink-2);font-size:15px}
.wk button:hover{background:var(--card);color:var(--ink)}
.wk .lab{padding:0 8px;text-align:center;line-height:1.15;white-space:nowrap}
.wk .lab b{display:block;font-size:12.5px;font-weight:700}.wk .lab span{display:block;font-size:10.5px;color:var(--ink-3)}
.ico{width:34px;height:34px;border-radius:99px;background:var(--sunk);display:grid;place-items:center;color:var(--ink-2);flex:none}
.ico:hover{color:var(--ink)}

main{padding:18px 0 30px}
.panel[hidden]{display:none!important}
.sec{margin:0 0 28px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.sec-h h2{flex:1}
.sec-h .n{font-size:13px;font-weight:600;color:var(--ink-3)}
.sec-p{margin:0 0 14px;color:var(--ink-2);font-size:14px;line-height:1.5}
.band{background:var(--band);margin:0 -18px;padding:22px 18px 24px;border-radius:0}
@media(min-width:720px){.band{border-radius:20px;margin:0}}

/* search */
.srch{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--rule-2);border-radius:99px;padding:0 16px;height:46px;margin-bottom:22px}
.srch input{border:none;background:none;outline:none;width:100%;font-size:15px}
.srch svg{color:var(--ink-3);flex:none}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -18px;padding-left:18px;padding-right:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:8px 14px;border:1.5px solid var(--rule-2);background:var(--card);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip i{width:8px;height:8px;border-radius:99px;background:var(--tc)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}

/* horizontal scroller */
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:18px;scrollbar-width:none;margin:0 -18px;padding:4px 18px 8px}
.hs::-webkit-scrollbar{display:none}
.hs>*{flex:0 0 74%;scroll-snap-align:start}
@media(min-width:520px){.hs>*{flex-basis:calc(50% - 6px)}}
@media(min-width:720px){.hs>*{flex-basis:calc(33.333% - 8px)}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}

/* recipe card */
.rc{display:block;width:100%}
.shot{position:relative;aspect-ratio:1/1;border-radius:20px;overflow:hidden;background:var(--tc);box-shadow:var(--sh)}
.shot img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.rc:hover .shot img{transform:scale(1.04)}
@media(prefers-reduced-motion:reduce){.shot img{transition:none}.rc:hover .shot img{transform:none}}
.shot .noimg{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;color:#fff;
  background:linear-gradient(150deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#000))}
.shot .noimg span{font-weight:800;font-size:18px;line-height:1.15;letter-spacing:-.02em}
.shot .pin{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);color:#121314;
  border-radius:99px;padding:5px 10px 5px 8px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;backdrop-filter:blur(6px)}
.shot .pin i{width:7px;height:7px;border-radius:99px;background:var(--tc)}
.shot .in{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:99px;background:var(--ok);color:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.rc h3{margin:10px 0 2px;font-size:15.5px;line-height:1.2;font-weight:700;letter-spacing:-.015em}
.rc .m{font-size:12.5px;color:var(--ink-3)}

/* basket card (recipes to cook) */
.bk{display:block;width:100%;position:relative}
.bk .shot{aspect-ratio:1/1}
.bk .ck{position:absolute;top:10px;right:10px;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.95);color:#121314;border-radius:99px;padding:7px 12px 7px 9px;font-size:12.5px;font-weight:700;backdrop-filter:blur(6px)}
.bk .ck i{width:16px;height:16px;border-radius:5px;border:2px solid #121314;display:grid;place-items:center;color:transparent}
.bk.done .ck i{background:var(--ok);border-color:var(--ok);color:#fff}
.bk.done .shot img{filter:grayscale(.5);opacity:.75}
.bk .ctl{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:8px}
.stp{display:inline-flex;align-items:center;background:rgba(255,255,255,.95);color:#121314;border-radius:99px;padding:3px;backdrop-filter:blur(6px)}
.stp button{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font-size:17px;font-weight:600;color:#121314}
.stp button:hover{background:#ECECE8}
.stp b{min-width:26px;text-align:center;font-size:14px}
.bk .rm{margin-left:auto;width:36px;height:36px;border-radius:99px;background:#121314;color:#fff;display:grid;place-items:center}
.bk .rm:hover{background:var(--t7)}

/* days */
.day{background:var(--card);border:1.5px solid var(--rule);border-radius:20px;padding:12px 12px 12px;margin-bottom:10px}
.day.now{border-color:var(--ink)}
.day-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 10px}
.day-h b{font-size:16px;font-weight:800;letter-spacing:-.02em}.day-h span{font-size:12px;color:var(--ink-3)}
.day.now .day-h span{color:var(--ok);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.slots{grid-template-columns:1fr}.slots .sl{min-height:0;flex-direction:row;align-items:center;padding:11px 12px;gap:10px}.slots .sl .plus{margin:0 0 0 auto}.slots .sl .t{min-width:78px;margin:0}}
.sl{border-radius:14px;padding:8px;min-height:74px;display:flex;flex-direction:column;gap:6px;background:var(--band);border:1.5px dashed var(--rule-2);width:100%}
.sl:hover{border-color:var(--ink-3)}
.sl .t{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sl .plus{font-size:13px;color:var(--ink-3);margin-top:auto}
.sl.on{background:var(--card);border:1.5px solid var(--rule);flex-direction:row;align-items:center;gap:8px;padding:7px}
.sl.on .th{width:40px;height:40px;border-radius:10px;overflow:hidden;background:var(--tc);flex:none}
.sl.on .th img{width:100%;height:100%;object-fit:cover}
.sl.on .nm{font-size:12px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sl.on .t{margin-bottom:1px}
@media(max-width:560px){.sl.on{padding:7px 10px 7px 7px}.sl.on .th{width:48px;height:48px}.sl.on>span:last-child{display:flex;flex-direction:column;min-width:0}.sl.on .t{min-width:0}}

/* prep */
.pr{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--rule)}
.pr:first-child{border-top:none;padding-top:0}
.pr i{width:8px;height:8px;border-radius:99px;background:var(--tc);flex:none;margin-top:6px}
.pr b{font-size:14px;font-weight:700;display:block;line-height:1.3}
.pr span{font-size:13px;color:var(--ink-2);line-height:1.45}

/* shopping */
.aisle{margin-bottom:22px}
.ah{display:flex;align-items:center;gap:10px;padding:0 2px 8px;margin-bottom:2px;border-bottom:2px solid var(--ink)}
.ah h3{font-size:15px}.ah em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;color:var(--ink-3)}
.it{display:flex;align-items:flex-start;gap:13px;padding:11px 4px;width:100%;border-bottom:1px solid var(--rule)}
.it:last-child{border-bottom:none}
.bx{width:22px;height:22px;flex:none;border:2px solid var(--rule-2);border-radius:7px;display:grid;place-items:center;color:transparent;margin-top:1px}
.it.ok .bx{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.it.ok .nm{text-decoration:line-through;color:var(--ink-3)}
.it.ok .q{color:var(--ink-3)}
.it .b{flex:1;min-width:0;display:flex;flex-direction:column}
.it .nm{font-size:15px;font-weight:600;line-height:1.3}
.it .fr{font-size:12px;color:var(--ink-3);line-height:1.4;margin-top:2px}
.it .q{font-size:14px;font-weight:700;white-space:nowrap;padding-left:8px;color:var(--ink-2)}
.it .q.soft{font-weight:400;font-style:italic;font-size:12.5px;color:var(--ink-3)}
.prog{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk);margin:10px 0 14px}
.prog i{height:100%;background:var(--ok)}
.addr{display:flex;gap:8px;margin-top:10px}
.addr input{flex:1;background:var(--card);border:1.5px solid var(--rule-2);border-radius:99px;padding:11px 16px;outline:none;font-size:15px}
.addr input:focus{border-color:var(--ink)}
.empty{text-align:center;padding:44px 20px;border:1.5px dashed var(--rule-2);border-radius:20px;color:var(--ink-3)}
.empty b{display:block;font-size:17px;font-weight:800;color:var(--ink-2);margin-bottom:6px;letter-spacing:-.02em}
.empty .btn{margin-top:14px}

/* missing */
.mc{background:var(--card);border:1.5px solid var(--rule);border-radius:20px;padding:16px 17px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.mc h3{font-size:17px}.mc .by{font-size:12px;color:var(--ink-3)}
.mc .why{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.mc .have{font-size:13px;color:var(--ink-2);line-height:1.5;border-left:3px solid var(--tc);padding-left:11px}
.mc a{color:var(--ink);font-size:13.5px;font-weight:700;text-decoration:none;align-self:flex-start;border-bottom:1.5px solid var(--rule-2)}
.gate{background:var(--sunk);border-radius:99px;padding:2px 8px;font-size:11px;font-weight:700;color:var(--ink-2)}

/* bottom nav */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav)}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:11px;font-weight:600;position:relative}
.nb svg{width:24px;height:24px}
.nb[aria-selected="true"]{color:var(--ink)}
.nb .bd{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--ok);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
.nb .bd:empty,.nb .bd[data-z="1"]{display:none}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,11,12,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.veil[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94vh;border-radius:24px 24px 0 0;box-shadow:var(--sh-lg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:760px){.veil{align-items:center;padding:24px}.sheet{border-radius:24px;max-height:90vh}}
.sb{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.hero{position:relative;aspect-ratio:4/3;background:var(--tc);max-height:46vh;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .noimg{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(150deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#000))}
.hero .noimg span{font-weight:800;font-size:26px;color:#fff;letter-spacing:-.02em}
.hero .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:99px;background:rgba(255,255,255,.94);color:#121314;display:grid;place-items:center;font-size:18px;z-index:2}
.hero .grab{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:99px;background:rgba(255,255,255,.7)}
.sc{padding:18px 20px 24px}
.sc h2{font-size:26px;margin-bottom:6px}
.sc .dek{color:var(--ink-2);font-size:14.5px;margin-bottom:12px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.macros{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--rule);border-radius:16px;overflow:hidden;margin-bottom:18px}
.macros div{padding:10px 12px;border-right:1.5px solid var(--rule)}.macros div:last-child{border-right:none}
.macros .k{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.macros .v{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.hint{background:var(--band);border-left:3px solid var(--tc);border-radius:0 14px 14px 0;padding:12px 15px;font-size:13.5px;line-height:1.55;color:var(--ink-2);margin:0 0 20px}
.hint b{color:var(--ink)}
.sh{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.ig{list-style:none;margin:0 0 6px;padding:0}
.ig li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14.5px;line-height:1.35}
.ig li:last-child{border-bottom:none}
.ig .q{font-weight:800;min-width:66px;flex:none}
.ig .nt{color:var(--ink-3);font-size:13px}
.gh{font-weight:800;font-size:14px;margin:16px 0 4px;letter-spacing:-.01em}
.gh:first-child{margin-top:0}
.steps{list-style:none;counter-reset:s;margin:0 0 22px;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{counter-increment:s;display:flex;gap:13px;font-size:14.5px;line-height:1.6}
.steps li::before{content:counter(s);font-weight:800;font-size:12px;width:24px;height:24px;flex:none;border-radius:99px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;margin-top:2px}
.src{font-size:12.5px;color:var(--ink-3);line-height:1.7;border-top:1px solid var(--rule);padding-top:14px}
.src a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:1.5px solid var(--rule-2)}
.foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);background:var(--bg);display:flex;gap:10px;align-items:center}
.foot .stp{background:var(--sunk);color:var(--ink)}.foot .stp button{color:var(--ink)}.foot .stp button:hover{background:var(--card)}
.foot .btn{flex:1}
.pk{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--rule);width:100%}
.pk:last-child{border-bottom:none}

 s:["Heat the oven to 200 °C. Dice the sweet potatoes into 2 cm chunks — no need to peel. Tip onto a large tray, drizzle with olive oil, season and toss.","On a separate metal tray, scatter the chilli powder, flour and a big pinch of salt. Toss the chicken thighs in it, drizzle with olive oil and toss again. Roast both trays 35–40 minutes.","Meanwhile, finely slice the red onion into a bowl with the vinegar, honey and a pinch of salt. Scrunch with your hands and leave to quick-pickle.","Toast the chilli flakes in a dry pan about thirty seconds, then add the honey and vinegar and cook a minute until bubbling.","Once the chicken is cooked, coat it in that glaze and return to the oven five minutes until sticky.","Finely chop the jalapeños. Crumble the feta into a bowl, add the jalapeños and crush together with a fork. Drizzle with oil and season.","Shake all the dressing ingredients together and season.","Cook the quinoa pouches, tip into a bowl, stir through chopped coriander and a little oil, and season.","Chunk the cucumber. Massage the kale with a spoonful of dressing until softened.","Kale and coriander quinoa in the base, then divide between four containers. Top with sweet potato, chicken, cucumber and pickled onion; spoon on the spicy feta. Keeps three days. Dress, chop and toss just before eating."],
 note:"The <em>chop it in the bowl with scissors</em> trick is from the video, and it's the whole point: that's what the salad bars do before they serve you."},

 s:["Grate the ginger and garlic. Chop the coriander stalks and leaves, setting the leaves aside for garnish.","Heat a glug of oil in a heavy pan over medium heat. Fry the curry paste two minutes, then transfer to a large bowl.","Add the chicken mince, coriander stalks, ginger, garlic, egg, breadcrumbs, fish sauce and the lime zest — keep the zested lime. Add salt, mix until sticky, and form sixteen balls of about 40 g.","Fry the meatballs in batches in more oil over medium-high heat 5–8 minutes until golden all over. Set aside.","In the same pan, fry the second lot of curry paste one to two minutes, then add the coconut milk and stock. Boil, then simmer ten minutes. Squeeze in the reserved lime and season with salt and fish sauce.","Cook the rice following the packet.","For the salad, slice the spring onions into strips and pick the herb leaves into a bowl. Slice the chilli into a separate bowl with the other dressing ingredients, stir until the sugar dissolves, and pour over the salad.","Before serving, drop the meatballs into the broth and gently reheat. Serve over rice with the salad and extra lime."],

{id:"squashorzo",n:"Onion Squash Orzo",sub:"hot honey, crisp sage and roasted seeds",t:"oven",by:"mob",byn:"Mob",d:"—",lang:"EN",url:"https://www.mob.co.uk/",noimg:true,dir:"—",serves:2,mins:55,
 prep:"Roast, blitz, stir through. The seeds roast while the squash does.",
 i:[[600,"g","onion squash","produce"],[1,"","white onion","produce"],[2,"","tomatoes","produce"],[2,"cloves","garlic","produce","unpeeled"],[0.5,"tsp","chilli flakes","pantry"],[20,"g","fresh sage","produce"],[200,"g","orzo","pantry"],[20,"g","salted butter","dairy"],[200,"ml","chicken stock","pantry"],[30,"g","hot honey","pantry"],[30,"g","Parmesan","dairy"],[0.25,"","lemon","produce"],[null,"","rapeseed oil","pantry"]],
 s:["Heat the oven to 200 °C fan.","Halve the squash from stem to tip. Scoop out the seeds and keep them. Quarter the onion through the root with its skin on. Halve the tomatoes.","Cut each squash half into four to six wedges on a baking sheet with space between them. Tuck the onion, tomatoes and unpeeled garlic in the gaps, cut side down. Oil generously, sprinkle with chilli flakes and salt, and roast 35–45 minutes, turning the wedges after about 25.","Meanwhile spread the seeds on a small tray, separating them from the flesh with two forks. Oil, salt, and roast 20–25 minutes until golden, shuffling once or twice. With ten minutes left, add the sage leaves dragged through the oil.","Cook the orzo in salted water two minutes less than the packet says. Drain, rinse cold, fork through, and return to the pan.","Blitz half the squash with the tomatoes, onion and garlic (skins off), the tray juices, the butter, a pinch of salt and two thirds of the stock until silky.","Drizzle hot honey over the remaining wedges and return them to the oven, turning it off.","Pour the sauce into the orzo over low-medium heat for two to three minutes. Grate in two thirds of the Parmesan and squeeze in the lemon. Loosen with more stock so it flows like the loosest risotto. Check seasoning.","Top with the wedges, more Parmesan, the roasted seeds and sage, and a really generous drizzle of hot honey."],
 note:"<b>No photo</b> — this came from mob.co.uk rather than a reel. The roasted seeds are the part people skip and shouldn't."},

/* ═══════════ STATE ═══════════
   basket: what we're cooking this week  {id:{serv,cooked}}
   days:   optional day assignment       {"0-l": id}
   The shopping list is built from the basket, never from the days. */
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],FULL=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const SLOTS=[["b","Breakfast"],["l","Lunch"],["d","Dinner"]];
const RM=Object.fromEntries(R.map(r=>[r.id,r]));
const IMG=r=>r.noimg?null:"recipe-images/"+r.id+".jpg";
let DB=null,wOff=0,tab="book",S=blank(),F={type:null,q:""};
function blank(){return {basket:{},days:{},checked:{},extras:[]};}
const monday=o=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);d.setHours(0,0,0,0);return d;};
const wkey=o=>{const m=monday(o);return m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")+"-"+String(m.getDate()).padStart(2,"0");};
const fmt=d=>d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const basket=()=>Object.entries(S.basket).map(([id,v])=>({id,...v,r:RM[id]})).filter(x=>x.r);
function fq(q){if(q==null)return "";const r=Math.round(q*100)/100;if(Math.abs(r-Math.round(r))<.005)return String(Math.round(r));
  const fr={0.25:"¼",0.33:"⅓",0.5:"½",0.67:"⅔",0.75:"¾"};const w=Math.floor(r),f=Math.round((r-w)*100)/100;return fr[f]?(w||"")+fr[f]:String(r);}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200);}
function normalize(d){
  const s=blank();
  if(d){
    s.basket=d.basket||{};s.days=d.days||{};s.checked=d.checked||{};s.extras=d.extras||[];
    if(!d.basket&&d.slots){ /* migrate the old day-first shape */
      for(const k in d.slots){const v=d.slots[k];if(!RM[v.id])continue;
        s.days[k]=v.id;if(!s.basket[v.id])s.basket[v.id]={serv:v.serv||RM[v.id].serves,cooked:false};}
    }
  }
  return s;
}
const LS=k=>"reelkitchen3:"+k;
function loadLocal(){let raw=null;try{raw=localStorage.getItem(LS(wkey(wOff)))||localStorage.getItem("reelkitchen2:"+wkey(wOff));}catch(e){}
  S=normalize(raw?JSON.parse(raw):null);}
const saveLocal=()=>{try{localStorage.setItem(LS(wkey(wOff)),JSON.stringify(S));}catch(e){}};
let tmr=null;
function save(){saveLocal();if(!DB)return;clearTimeout(tmr);
  tmr=setTimeout(()=>DB.doc("weeks/"+wkey(wOff)).set({...S,updated:new Date().toISOString()}).catch(e=>{if(e&&e.code!=="unavailable")toast("Saved on this device only");}),700);}
let un=null;
function watch(){if(un){un();un=null;}loadLocal();draw();if(!DB)return;
  un=DB.doc("weeks/"+wkey(wOff)).onSnapshot(s=>{if(s.metadata.hasPendingWrites||!s.exists)return;S=normalize(s.data());saveLocal();draw();},()=>{});}

/* ═══════════ SHOPPING ═══════════ */
function list(){
  const m=new Map();
  for(const b of basket()){
    const mult=(b.serv||b.r.serves)/b.r.serves;
    for(const g of b.r.i){if(g[0]==="G")continue;const [q,u,name,aisle,note]=g;const key=name.toLowerCase()+"|"+aisle;
      if(!m.has(key))m.set(key,{name,aisle,units:{},soft:false,from:new Set(),notes:new Set()});
      const e=m.get(key);e.from.add(b.r.n);if(note)e.notes.add(note);
      if(q==null)e.soft=true;else{const uu=u||"×";e.units[uu]=(e.units[uu]||0)+q*mult;}}
  }
  const out={};for(const [key,e] of m)(out[e.aisle]=out[e.aisle]||[]).push({key,...e});
  for(const a in out)out[a].sort((x,y)=>x.name.localeCompare(y.name));return out;
}
const qtxt=e=>{const p=Object.entries(e.units).map(([u,v])=>fq(v)+(u==="×"?"":" "+u));return p.length?p.join(" + "):null;};

/* ═══════════ BITS ═══════════ */
const CHK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
function shot(r,over){const src=IMG(r);return `<div class="shot" style="--tc:${T[r.t].c}">`+(src?`<img src="${src}" alt="" loading="lazy" onerror="this.remove()">`:`<div class="noimg"><span>${esc(r.n)}</span></div>`)+(over||"")+`</div>`;}
function card(r){const inb=!!S.basket[r.id];
  return `<button class="rc" data-open="${r.id}">${shot(r,`<span class="pin"><i></i>${esc(T[r.t].short)}</span>${inb?`<span class="in">${CHK}</span>`:""}`)}
    <h3>${esc(r.n)}</h3><div class="m">${r.mins} min · serves ${r.serves}${r.m&&r.m.p?" · "+r.m.p+" g protein":""}</div></button>`;}

/* ═══════════ BOOK ═══════════ */
const hit=r=>(!F.type||r.t===F.type)&&(!F.q||(r.n+" "+r.sub+" "+r.byn+" "+r.by+" "+r.i.map(x=>x[2]).join(" ")).toLowerCase().includes(F.q.toLowerCase()));
function drawBook(){
  const got=R.filter(hit),nb=Object.keys(S.basket).length;
  const chips=`<button class="chip" data-type="" aria-pressed="${!F.type}">All ${R.length}</button>`+TYPES.map(t=>`<button class="chip" style="--tc:${t.c}" data-type="${t.id}" aria-pressed="${F.type===t.id}"><i></i>${esc(t.short)}</button>`).join("");
  let body;
  if(F.q||F.type){
    const t=F.type&&T[F.type];
    body=`<div class="sec">${t?`<div class="sec-h"><h2>${esc(t.label)}</h2><span class="n">${got.length}</span></div><p class="sec-p">${esc(t.desc)}</p>`:`<div class="sec-h"><h2>Results</h2><span class="n">${got.length}</span></div>`}
      ${got.length?`<div class="grid">${got.map(card).join("")}</div>`:`<div class="empty"><b>Nothing matches</b>Try another word or clear the filter.</div>`}</div>`;
  }else{
    body=TYPES.map(t=>{const rs=R.filter(r=>r.t===t.id);if(!rs.length)return "";
      return `<div class="sec"><div class="sec-h"><h2>${esc(t.label)}</h2><span class="n">${rs.length}</span></div><p class="sec-p">${esc(t.desc)}</p><div class="hs">${rs.map(card).join("")}</div></div>`;}).join("");
  }
  document.getElementById("p-book").innerHTML=`
    <div class="srch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Search a dish, an ingredient, a creator…" value="${esc(F.q)}"></div>
    <div class="chips" style="margin-bottom:22px">${chips}</div>
    ${nb?`<div class="band" style="margin-bottom:24px"><div class="sec-h"><h2>Cooking this week</h2><span class="n">${nb}</span></div><p class="sec-p">Tap a dish to change servings or take it out. Then plan the days on <b>This Week</b>.</p>
      <div class="hs">${basket().map(b=>card(b.r)).join("")}</div></div>`:""}
    ${body}`;
}

/* ═══════════ THIS WEEK ═══════════ */
function drawWeek(){
  const bk=basket(),mon=monday(wOff),today=(()=>{const t=new Date();t.setHours(0,0,0,0);return t.getTime();})();
  const cards=bk.map(b=>`<div class="bk${b.cooked?" done":""}" style="--tc:${T[b.r.t].c}">
      ${shot(b.r,`<button class="ck" data-cook="${b.id}"><i>${CHK}</i>Cooked</button>
        <div class="ctl"><span class="stp"><button data-sv="${b.id}" data-d="-1" aria-label="Fewer">−</button><b>${b.serv}</b><button data-sv="${b.id}" data-d="1" aria-label="More">+</button></span>
        <button class="rm" data-rm="${b.id}" aria-label="Remove">${'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>'}</button></div>`)}
      <button class="rc" data-open="${b.id}" style="display:block"><h3>${esc(b.r.n)}</h3><div class="m">${b.serv} serving${b.serv===1?"":"s"} · ${b.r.mins} min</div></button></div>`).join("");
  let days="";
  for(let i=0;i<7;i++){const dd=new Date(mon);dd.setDate(mon.getDate()+i);const now=dd.getTime()===today;let sl="";
    for(const [sk,sn] of SLOTS){const key=i+"-"+sk,id=S.days[key],r=id&&RM[id];
      if(r){const src=IMG(r);sl+=`<button class="sl on" style="--tc:${T[r.t].c}" data-slot="${key}"><span class="th">${src?`<img src="${src}" alt="" loading="lazy" onerror="this.remove()">`:""}</span><span><span class="t">${sn}</span><span class="nm">${esc(r.n)}</span></span></button>`;}
      else sl+=`<button class="sl" data-slot="${key}"><span class="t">${sn}</span><span class="plus">+ Choose</span></button>`;}
    days+=`<div class="day${now?" now":""}"><div class="day-h"><b>${FULL[i]}</b><span>${now?"today":fmt(dd)}</span></div><div class="slots">${sl}</div></div>`;}
  const ahead=["freezer-raw","freezer-cooked","fridge"];let A="",B="";
  for(const b of bk){const row=`<div class="pr" style="--tc:${T[b.r.t].c}"><i></i><div><b>${esc(b.r.n)}</b><span>${esc(b.r.prep)}</span></div></div>`;ahead.includes(b.r.t)?A+=row:B+=row;}
  document.getElementById("p-week").innerHTML=`
    <div class="band" style="margin-bottom:26px">
      <div class="sec-h"><h2>Recipes to cook</h2><span class="n">${bk.length}</span></div>
      <p class="sec-p">${bk.length?"Servings here are what scale the shopping list. Tick <b>Cooked</b> as you go.":"Start here: pick what you feel like eating this week. Days come after."}</p>
      ${bk.length?`<div class="hs">${cards}</div><div class="row" style="margin-top:14px"><button class="btn o s" data-go="book">+ Add more from the Book</button><button class="btn o s" data-pre="clear">Clear the week</button></div>`
        :`<div class="empty"><b>Nothing picked yet</b>Browse the Book and add whatever looks good.<br><button class="btn" data-go="book">Open the Book</button></div>`}
    </div>
    ${bk.length?`<div class="sec"><div class="sec-h"><h2>Plan by day</h2><span class="n">optional</span></div>
      <p class="sec-p">Tap a slot and pick from what you're already cooking. Leave it loose if you'd rather decide on the day.</p>${days}</div>
    <div class="sec"><div class="sec-h"><h2>Prep board</h2></div><p class="sec-p">What this week's picks owe you before the day you eat them.</p>
      ${A?`<p class="lbl" style="margin:0 0 8px">Do ahead</p>${A}`:""}${B?`<p class="lbl" style="margin:${A?"16px":"0"} 0 8px">On the day</p>${B}`:""}</div>`:""}`;
}

/* ═══════════ SHOPPING ═══════════ */
function drawShop(){
  const bk=basket();
  if(!bk.length){document.getElementById("p-shop").innerHTML=`<div class="hdr"><h2>Shopping list</h2><p>Built from the recipes you're cooking this week.</p></div>
    <div class="empty"><b>Nothing to buy yet</b>Pick some recipes first.<br><button class="btn" data-go="book">Open the Book</button></div>`;
    document.getElementById("b-shop").textContent="";return;}
  const by=list();let tot=0,done=0,html="";
  for(const [aid,an] of AISLES){const it=by[aid];if(!it||!it.length)continue;let rows="",ad=0;
    for(const e of it){tot++;const ok=!!S.checked[e.key];if(ok){done++;ad++;}const q=qtxt(e);
      rows+=`<button class="it${ok?" ok":""}" data-chk="${esc(e.key)}"><span class="bx">${CHK}</span><span class="b"><span class="nm">${esc(e.name)}</span><span class="fr">${esc([...e.from].join(" · "))}${e.notes.size?" — "+esc([...e.notes].join("; ")):""}</span></span><span class="q${q?"":" soft"}">${q?esc(q):(e.soft?"as needed":"")}</span></button>`;}
    html+=`<div class="aisle"><div class="ah"><h3>${esc(an)}</h3><em>${ad}/${it.length}</em></div>${rows}</div>`;}
  let ex="";S.extras.forEach((x,i)=>{tot++;const ok=!!S.checked["x:"+i];if(ok)done++;
    ex+=`<button class="it${ok?" ok":""}" data-chk="x:${i}"><span class="bx">${CHK}</span><span class="b"><span class="nm">${esc(x)}</span><span class="fr">added by you</span></span><span class="q soft" data-del="${i}">remove</span></button>`;});
  document.getElementById("p-shop").innerHTML=`
    <div class="hdr"><h2>Shopping list <span class="muted" style="font-weight:600">(${tot})</span></h2><p>${bk.length} recipe${bk.length===1?"":"s"}, week of ${fmt(monday(wOff))}. Tick as you go — it remembers.</p></div>
    <div class="prog"><i style="width:${tot?done/tot*100:0}%"></i></div>
    <div class="row" style="margin-bottom:22px"><button class="btn o s" id="cpy">Copy as text</button><button class="btn o s" id="unc">Untick all</button></div>
    ${html}
    <div class="aisle"><div class="ah"><h3>Add your own</h3></div>${ex}<div class="addr"><input id="xa" placeholder="Milk, coffee, olive oil…" aria-label="Add an item"><button class="btn" id="xb">Add</button></div></div>
    <p class="tiny muted" style="margin-top:22px;line-height:1.55">Amounts add together only when creators used the same unit; otherwise both are shown — <b>500 g + 2 tbsp</b> — rather than a guessed conversion. <i>As needed</i> means the post gave no quantity.</p>`;
  const left=tot-done;document.getElementById("b-shop").textContent=left?String(left):"";
}

/* ═══════════ MISSING ═══════════ */
function drawGone(){document.getElementById("p-gone").innerHTML=`<div class="hdr"><h2>Still missing</h2><p>Eight reels that hide the method behind a comment, a DM or a link in bio — and whose audio was music, so the transcript couldn't fill the gap. What's known, so you're not starting from zero.</p></div>
  ${GONE.map(m=>`<div class="mc" style="--tc:${T[m.t].c}"><h3>${esc(m.n)}</h3><div class="by">@${esc(m.by)} · ${esc(m.d)} &nbsp;<span class="gate">${esc(m.gate)}</span></div><div class="why">${esc(m.why)}</div><div class="have">${m.have}</div><a href="${esc(m.url)}" target="_blank" rel="noopener">Open the post ↗</a></div>`).join("")}`;}

/* ═══════════ SHEETS ═══════════ */
const veil=document.getElementById("veil"),sheet=document.getElementById("sheet");
const shut=()=>{veil.hidden=true;sheet.innerHTML="";};
veil.addEventListener("click",e=>{if(e.target===veil)shut();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!veil.hidden)shut();});

function openRecipe(id){
  const r=RM[id];if(!r)return;const c=T[r.t].c,src=IMG(r),inb=S.basket[id];
  let ing="",open=false;
  for(const x of r.i){if(x[0]==="G"){if(open)ing+="</ul>";ing+=`<div class="gh">${esc(x[2])}</div><ul class="ig">`;open=true;continue;}
    if(!open){ing+='<ul class="ig">';open=true;}const [q,u,nm,,nt]=x;
    ing+=`<li><span class="q">${esc(q==null?"":fq(q)+(u?" "+u:""))}</span><span>${esc(nm)}${nt?` <span class="nt">${esc(nt)}</span>`:""}</span></li>`;}
  if(open)ing+="</ul>";const m=r.m;
  sheet.innerHTML=`<div class="sb" style="--tc:${c}">
    <div class="hero">${src?`<img src="${src}" alt="${esc(r.n)}" onerror="this.remove()">`:`<div class="noimg"><span>${esc(r.n)}</span></div>`}<span class="grab"></span><button class="x" id="x1" aria-label="Close">×</button></div>
    <div class="sc"><h2>${esc(r.n)}</h2><div class="dek">${esc(r.sub)}</div>
      <div class="meta"><span class="pill" style="--tc:${c}"><i></i>${esc(T[r.t].short)}</span><span class="pill">${r.mins} min</span><span class="pill">serves ${r.serves}</span><span class="pill">@${esc(r.by.split(" ")[0])}</span>${r.merged?'<span class="pill">merged</span>':""}${r.partial?'<span class="pill" style="color:var(--warn)">partial</span>':""}${r.lang.includes("→")?'<span class="pill">translated</span>':""}</div>
      ${m?`<div class="macros">${m.kcal?`<div><div class="k">Kcal</div><div class="v">${m.kcal}</div></div>`:""}<div><div class="k">Protein</div><div class="v">${m.p}g</div></div>${m.c!=null?`<div><div class="k">Carbs</div><div class="v">${m.c}g</div></div>`:""}${m.f!=null?`<div><div class="k">Fat</div><div class="v">${m.f}g</div></div>`:""}</div>`:""}
      <div class="hint">${r.note}</div>
      <p class="sh">Ingredients · serves ${r.serves}</p>${ing}
      <p class="sh" style="margin-top:22px">Method</p><ol class="steps">${r.s.map(s=>`<li><span>${s}</span></li>`).join("")}</ol>
      <div class="src"><a href="${esc(r.url)}" target="_blank" rel="noopener">${r.dir==="—"?"mob.co.uk":"Original reel"} ↗</a>${r.url2?` &nbsp; <a href="${esc(r.url2)}" target="_blank" rel="noopener">Second source ↗</a>`:""}${r.dir!=="—"?`<br>${esc(r.dir)}/video.mp4`:""}</div>
    </div></div>
    <div class="foot"><span class="stp"><button id="dn" aria-label="Fewer servings">−</button><b id="sv">${inb?inb.serv:r.serves}</b><button id="up" aria-label="More servings">+</button></span>
      ${inb?`<button class="btn g" id="put">${CHK} In this week</button><button class="btn o" id="out" aria-label="Remove">Remove</button>`:`<button class="btn" id="put">Add to this week</button>`}</div>`;
  veil.hidden=false;sheet.querySelector(".sb").scrollTop=0;sheet.querySelector("#x1").onclick=shut;
  let sv=inb?inb.serv:r.serves;const v=sheet.querySelector("#sv");
  const commit=()=>{if(S.basket[id]){S.basket[id].serv=sv;save();draw();}};
  sheet.querySelector("#up").onclick=()=>{sv++;v.textContent=sv;commit();};
  sheet.querySelector("#dn").onclick=()=>{if(sv>1){sv--;v.textContent=sv;commit();}};
  sheet.querySelector("#put").onclick=()=>{if(S.basket[id]){shut();return;}S.basket[id]={serv:sv,cooked:false};save();draw();shut();toast("Added — "+sv+" serving"+(sv===1?"":"s"));};
  const out=sheet.querySelector("#out");if(out)out.onclick=()=>{removeFromBasket(id);shut();};
}
function removeFromBasket(id){delete S.basket[id];for(const k in S.days)if(S.days[k]===id)delete S.days[k];save();draw();toast("Removed from this week");}
const slotName=k=>{const[i,s]=k.split("-");return FULL[+i]+" "+SLOTS.find(x=>x[0]===s)[1].toLowerCase();};
function openSlot(key){
  const bk=basket(),cur=S.days[key];
  sheet.innerHTML=`<div class="sc" style="padding-top:22px"><div style="display:flex;align-items:flex-start;gap:12px"><div style="flex:1"><h2>${esc(slotName(key))}</h2><div class="dek">Pick from what you're cooking this week.</div></div><button class="ico" id="xp" aria-label="Close">×</button></div>
    <div style="margin-top:8px">${bk.map(b=>{const src=IMG(b.r);return `<button class="pk" data-pick="${b.id}"><span class="th" style="--tc:${T[b.r.t].c};background:${T[b.r.t].c}">${src?`<img src="${src}" alt="">`:""}</span><span><b>${esc(b.r.n)}</b><span>${b.serv} serving${b.serv===1?"":"s"} · ${b.r.mins} min</span></span>${cur===b.id?`<span class="chk">${CHK}</span>`:""}</button>`;}).join("")}</div>
    <div class="row" style="margin-top:18px">${cur?`<button class="btn o s" id="clr">Clear this slot</button>`:""}<button class="btn o s" data-go="book">+ Add more from the Book</button></div></div>`;
  veil.hidden=false;sheet.querySelector("#xp").onclick=shut;
  sheet.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{S.days[key]=b.dataset.pick;save();draw();shut();});
  const c=sheet.querySelector("#clr");if(c)c.onclick=()=>{delete S.days[key];save();draw();shut();};
}

/* ═══════════ WIRING ═══════════ */
function go(t){tab=t;document.querySelectorAll(".nb").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===t)));
  ["book","week","shop","gone"].forEach(p=>document.getElementById("p-"+p).hidden=(p!==t));
  document.getElementById("wk").hidden=(t==="book"||t==="gone");window.scrollTo({top:0,behavior:"instant"});}
function draw(){const n=Object.keys(S.basket).length;document.getElementById("b-week").textContent=n?String(n):"";
  document.getElementById("b-gone").textContent=String(GONE.length);
  drawBook();drawWeek();drawShop();drawGone();
  const mo=monday(wOff),su=new Date(mo);su.setDate(mo.getDate()+6);
  document.getElementById("wl").textContent=wOff===0?"This week":wOff===1?"Next week":wOff===-1?"Last week":(wOff>0?"In "+wOff+" weeks":Math.abs(wOff)+" weeks ago");
  document.getElementById("wd").textContent=fmt(mo)+" – "+fmt(su);}

document.addEventListener("click",e=>{
  const d=e.target.dataset||{};
  if(d.del!==undefined){e.stopPropagation();S.extras.splice(+d.del,1);S.checked={};save();drawShop();return;}
  const t=e.target.closest&&e.target.closest("[data-tab],[data-go],[data-open],[data-type],[data-chk],[data-pre],[data-cook],[data-sv],[data-rm],[data-slot]");
  if(!t)return;const D=t.dataset;
  if(D.tab){go(D.tab);return;}
  if(D.go){shut();go(D.go);return;}
  if(D.cook){S.basket[D.cook].cooked=!S.basket[D.cook].cooked;save();drawWeek();return;}
  if(D.sv){const b=S.basket[D.sv];b.serv=Math.max(1,b.serv+(+D.d));save();draw();return;}
  if(D.rm){removeFromBasket(D.rm);return;}
  if(D.slot){openSlot(D.slot);return;}
  if(D.open){openRecipe(D.open);return;}
  if(D.type!==undefined){F.type=D.type||null;drawBook();return;}
  if(D.chk){S.checked[D.chk]?delete S.checked[D.chk]:S.checked[D.chk]=1;save();drawShop();return;}
  if(D.pre==="clear"){S.basket={};S.days={};S.checked={};save();draw();toast("Week cleared");return;}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){F.q=e.target.value;drawBook();const i=document.getElementById("q");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}});
function addX(){const i=document.getElementById("xa");if(!i||!i.value.trim())return;S.extras.push(i.value.trim());i.value="";save();drawShop();const n=document.getElementById("xa");if(n)n.focus();}
document.addEventListener("keydown",e=>{if(e.target.id==="xa"&&e.key==="Enter")addX();});
document.addEventListener("click",e=>{
  if(e.target.id==="xb")addX();
  if(e.target.id==="unc"){S.checked={};save();drawShop();}
  if(e.target.id==="cpy"){const by=list();let t="Shopping — week of "+fmt(monday(wOff))+"\n\n";
    for(const [aid,an] of AISLES){const it=by[aid];if(!it||!it.length)continue;t+=an.toUpperCase()+"\n";it.forEach(x=>{const q=qtxt(x);t+="  · "+x.name+(q?"  "+q:"  (as needed)")+"\n";});t+="\n";}
    if(S.extras.length){t+="ALSO\n";S.extras.forEach(x=>t+="  · "+x+"\n");}
    navigator.clipboard.writeText(t).then(()=>toast("Copied"),()=>toast("Couldn't copy"));}
});
document.getElementById("wp").onclick=()=>{wOff--;watch();};
document.getElementById("wn").onclick=()=>{wOff++;watch();};
document.getElementById("theme").onclick=()=>{const c=document.documentElement.getAttribute("data-theme");const dark=c?c==="dark":matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("data-theme",dark?"light":"dark");};

/* A starter week on a first visit, so the board opens with something on it. */
function seed(){try{if(localStorage.getItem(LS("seeded")))return false;localStorage.setItem(LS("seeded"),"1");}catch(e){}
  if(wOff!==0||Object.keys(S.basket).length)return false;
  [["bagels",4],["tandoori",4],["palakpaneer",4],["slopbowl",4],["tunapizza",2],["calabacinfrio",4],["onepotbulgogi",2]].forEach(([id,sv])=>S.basket[id]={serv:sv,cooked:false});
  Object.assign(S.days,{"0-b":"bagels","0-d":"palakpaneer","1-l":"slopbowl","2-d":"tandoori","3-l":"calabacinfrio","4-d":"tunapizza"});
  saveLocal();return true;}
loadLocal();const fresh=seed();draw();go("week");
if(fresh)setTimeout(()=>toast("A starter week to show you around — change anything"),800);

</script>
